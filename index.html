<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Probability Calculator</title>
    <link
      rel="icon"
      href="img/favicon.png"
      type="image/png" />
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="align-center">
        <img
          id="gandalf-rune"
          src="img/gandalf-rune.png"
          alt="Gandalfs rune" />
        <h1 id="page_title">TOR 2ed Probability Assistant</h1>
      </div>

      <!-- separator -->
      <div class="separator"></div>

      <div class="is-display-grid">
        <!-- Num D6 -->
        <fieldset class="input-group">
          <legend
            class="title"
            id="label_num_d6">
            D6 Dice
          </legend>

          <label
            for="num_d6"
            id="label_num_d6_input">
            Dice to roll
          </label>

          <div class="number-input">
            <button
              class="decrement"
              type="button">
              -
            </button>

            <input
              type="number"
              id="num_d6"
              min="0"
              value="3" />

            <button
              class="increment"
              type="button">
              +
            </button>
          </div>
        </fieldset>

        <!-- Target -->
        <fieldset class="input-group">
          <legend
            class="title"
            id="label_target">
            Target
          </legend>

          <label
            for="target"
            id="label_target_input">
            Target Number
          </label>
          <div class="number-input">
            <button
              class="decrement"
              type="button">
              -
            </button>

            <input
              type="number"
              id="target"
              min="0"
              value="10" />

            <button
              class="increment"
              type="button">
              +
            </button>
          </div>
        </fieldset>

        <!-- D12 Mode -->
        <fieldset class="input-group">
          <legend
            class="title"
            id="label_d12_mode">
            D12 Mode
          </legend>

          <div>
            <input
              type="radio"
              id="d12_normal"
              name="d12_mode"
              value="0"
              checked />
            <label
              for="d12_normal"
              id="option_normal">
              Normal
            </label>
          </div>

          <div>
            <input
              type="radio"
              id="d12_favored"
              name="d12_mode"
              value="1" />
            <label
              for="d12_favored"
              id="option_favored">
              Favored
            </label>
          </div>

          <div>
            <input
              type="radio"
              id="d12_illfavored"
              name="d12_mode"
              value="-1" />
            <label
              for="d12_illfavored"
              id="option_illfavored">
              Ill-favored
            </label>
          </div>
        </fieldset>

        <!-- Checkboxes -->
        <fieldset class="input-group">
          <legend
            class="title"
            id="label_modifiers">
            Modifiers
          </legend>

          <div>
            <input
              type="checkbox"
              id="tired" />
            <label
              for="tired"
              id="label_tired">
              Tired
            </label>
          </div>

          <div>
            <input
              type="checkbox"
              id="demoralized" />
            <label
              for="demoralized"
              id="label_demoralized">
              Demoralized
            </label>
          </div>
        </fieldset>

        <fieldset class="grid-last-row">
          <legend
            class="title"
            id="label_result">
            Result
          </legend>
          <div id="result">%</div>
        </fieldset>
      </div>

      <!-- separator -->
      <div class="separator"></div>

      <div class="lang-switch">
        <button onclick="switchLanguage('es')">ES</button>
        <button onclick="switchLanguage('ca')">CA</button>
        <button onclick="switchLanguage('en')">EN</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
